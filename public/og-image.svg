<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=Inter:wght@700;800;900&amp;display=swap');
      .font-heading { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .font-sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#FAF7FC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="instaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#833AB4" />
      <stop offset="50%" stop-color="#E1306C" />
      <stop offset="100%" stop-color="#FD1D1D" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#0F172A" flood-opacity="0.07" />
    </filter>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#E1306C" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="100" r="300" fill="#E1306C" fill-opacity="0.05" />
  <circle cx="1000" cy="500" r="350" fill="#E60023" fill-opacity="0.04" />

  <!-- Main Floating App Card Mockup -->
  <rect x="80" y="65" width="1040" height="500" rx="36" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#softShadow)" />

  <!-- Header Bar -->
  <g transform="translate(140, 115)">
    <!-- Brand Mark -->
    <g transform="translate(0, 0)">
      <path d="M16 2 L2.2 24 h6 L16 12 L23.8 24 H29.8 Z" fill="url(#instaGrad)" />
      <path d="M16 12 L9.5 24 h13 Z" fill="none" stroke="#FFFFFF" stroke-width="2" />
    </g>
    <!-- Brand Name -->
    <text x="44" y="21" class="font-heading" font-size="28" font-weight="900" fill="#0F172A" letter-spacing="-0.5">ApexDownloader</text>

    <!-- Navigation Pills Mockup -->
    <rect x="620" y="-8" width="260" height="44" rx="14" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
    <rect x="624" y="-4" width="126" height="36" rx="10" fill="#FFFFFF" stroke="rgba(225,48,108,0.3)" stroke-width="1" />
    <text x="664" y="20" class="font-sans" font-size="15" font-weight="700" fill="#E1306C">Instagram</text>
    <text x="788" y="20" class="font-sans" font-size="15" font-weight="600" fill="#64748B">Pinterest</text>
  </g>

  <!-- Divider -->
  <line x1="140" y1="180" x2="1060" y2="180" stroke="#F1F5F9" stroke-width="1.5" />

  <!-- Hero Content -->
  <!-- Title -->
  <text x="600" y="245" text-anchor="middle" class="font-heading" font-size="44" font-weight="900" fill="#0F172A" letter-spacing="-1">Instagram &amp; Pinterest Media Downloader</text>
  <text x="600" y="285" text-anchor="middle" class="font-sans" font-size="20" font-weight="600" fill="#475569">Download original 1080p Reels, Stories, Photos &amp; 4K Pins in 1 Click.</text>

  <!-- URL Input Bar Mockup -->
  <g transform="translate(140, 320)">
    <rect width="920" height="68" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2" />
    <!-- Link Icon -->
    <path d="M35 34 C30 29 25 34 25 34 L21 38 C17 42 22 47 22 47" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Placeholder Text -->
    <text x="50" y="41" class="font-sans" font-size="18" font-weight="500" fill="#94A3B8">Paste Instagram Reel, Story, Post or Pinterest Pin link...</text>

    <!-- Paste Badge -->
    <rect x="660" y="15" width="80" height="38" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
    <text x="700" y="39" text-anchor="middle" class="font-sans" font-size="14" font-weight="600" fill="#475569">Paste</text>

    <!-- Fetch Button -->
    <rect x="752" y="10" width="156" height="48" rx="14" fill="url(#instaGrad)" filter="url(#badgeShadow)" />
    <text x="830" y="40" text-anchor="middle" class="font-sans" font-size="17" font-weight="700" fill="#FFFFFF">Fetch Media</text>
  </g>

  <!-- Trust Badges Footer Bar -->
  <g transform="translate(140, 435)">
    <!-- Badge 1: 100% Private -->
    <rect x="0" y="0" width="280" height="85" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="20" y="20" width="44" height="44" rx="12" fill="rgba(225,48,108,0.1)" />
    <text x="42" y="47" text-anchor="middle" class="font-sans" font-size="20">🛡️</text>
    <text x="80" y="40" class="font-sans" font-size="16" font-weight="700" fill="#0F172A">100% Private &amp; Safe</text>
    <text x="80" y="58" class="font-sans" font-size="13" font-weight="500" fill="#64748B">No login or account needed</text>

    <!-- Badge 2: Full HD Downloads -->
    <rect x="320" y="0" width="280" height="85" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="340" y="20" width="44" height="44" rx="12" fill="rgba(225,48,108,0.1)" />
    <text x="362" y="47" text-anchor="middle" class="font-sans" font-size="20">⚡</text>
    <text x="400" y="40" class="font-sans" font-size="16" font-weight="700" fill="#0F172A">1080p Full HD MP4</text>
    <text x="400" y="58" class="font-sans" font-size="13" font-weight="500" fill="#64748B">Original uncompressed media</text>

    <!-- Badge 3: Fast Direct Save -->
    <rect x="640" y="0" width="280" height="85" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="660" y="20" width="44" height="44" rx="12" fill="rgba(225,48,108,0.1)" />
    <text x="682" y="47" text-anchor="middle" class="font-sans" font-size="20">🔒</text>
    <text x="720" y="40" class="font-sans" font-size="16" font-weight="700" fill="#0F172A">Direct Device Save</text>
    <text x="720" y="58" class="font-sans" font-size="13" font-weight="500" fill="#64748B">Encrypted HTTPS delivery</text>
  </g>
</svg>
