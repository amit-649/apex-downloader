<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="infinityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007A" />
      <stop offset="50%" stop-color="#E60023" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFD6E8" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Squircle Backdrop -->
  <rect width="512" height="512" rx="140" fill="#0A0915" />
  
  <!-- Outer Neon Border Ring -->
  <rect x="12" y="12" width="488" height="488" rx="128" stroke="url(#infinityGrad)" stroke-width="12" stroke-opacity="0.6" fill="none" filter="url(#neonGlow)" />

  <!-- The Apex Infinity Loop Arrow Monogram -->
  <g filter="url(#neonGlow)">
    <!-- Infinity 'A' Outer Arch -->
    <path d="M140 330 C130 220, 200 130, 256 130 C312 130, 382 220, 372 330" 
          stroke="url(#infinityGrad)" stroke-width="44" stroke-linecap="round" fill="none" />
    
    <!-- Central Downward Arrow Stem & Arrowhead -->
    <path d="M256 130 V315 M175 234 L256 315 L337 234" 
          stroke="url(#arrowGrad)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Bottom Tray Line -->
    <path d="M140 395 H372" 
          stroke="url(#arrowGrad)" stroke-width="40" stroke-linecap="round" />
  </g>
</svg>
