<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="infinityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007A" />
      <stop offset="50%" stop-color="#E60023" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFD6E8" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Squircle Backdrop -->
  <rect width="512" height="512" rx="140" fill="#0A0915" />
  
  <!-- Outer Neon Border Ring -->
  <rect x="12" y="12" width="488" height="488" rx="128" stroke="url(#infinityGrad)" stroke-width="12" stroke-opacity="0.6" fill="none" filter="url(#neonGlow)" />

  <!-- True Interlocking Figure-8 Infinity Loop Emblem -->
  <g filter="url(#neonGlow)">
    <!-- Figure-8 Infinity Loop Path -->
    <path d="M256 256 c-45-45 -105-65 -145-25 s-10 100 50 130 s105-60 105-105 c0-45 45-105 105-105 s105 65 65 105 s-105 60-105 0" 
          stroke="url(#infinityGrad)" stroke-width="40" stroke-linecap="round" fill="none" />
    
    <!-- Central Downward Arrow -->
    <path d="M256 120 V330 M175 249 L256 330 L337 249" 
          stroke="url(#arrowGrad)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Bottom Anchor Line -->
    <path d="M140 405 H372" 
          stroke="url(#arrowGrad)" stroke-width="38" stroke-linecap="round" />
  </g>
</svg>
