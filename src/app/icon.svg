<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="apex-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E1306C" />
      <stop offset="50%" stop-color="#E60023" />
      <stop offset="100%" stop-color="#833AB4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#apex-grad)" />

  <!-- Download Arrow Icon -->
  <g filter="url(#glow)">
    <!-- Main Arrow Stem & Head -->
    <path d="M256 120 V300 M170 214 L256 300 L342 214" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Bottom Tray -->
    <path d="M140 376 H372" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round" />
    <!-- Sparkle Accent -->
    <path d="M370 140 L380 165 L405 175 L380 185 L370 210 L360 185 L335 175 L360 165 Z" fill="#FFDF7B" />
  </g>
</svg>
