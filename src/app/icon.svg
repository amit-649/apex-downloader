<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="apex-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E1306C" />
      <stop offset="50%" stop-color="#E60023" />
      <stop offset="100%" stop-color="#833AB4" />
    </linearGradient>
    <linearGradient id="apex-icon" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FCE7F3" />
    </linearGradient>
  </defs>

  <!-- Dark Obsidian Glass Backdrop -->
  <rect width="512" height="512" rx="140" fill="#0C0A1D" />
  <rect x="8" y="8" width="496" height="496" rx="132" fill="url(#apex-bg)" opacity="0.15" />
  <rect x="16" y="16" width="480" height="480" rx="124" stroke="url(#apex-bg)" stroke-width="12" fill="none" />

  <!-- Razor Sharp Geometric Apex Arrow Monogram -->
  <path d="M256 90 V320" stroke="url(#apex-icon)" stroke-width="48" stroke-linecap="round" />
  <path d="M140 210 L256 326 L372 210" stroke="url(#apex-icon)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M120 410 H392" stroke="url(#apex-icon)" stroke-width="44" stroke-linecap="round" />
</svg>
