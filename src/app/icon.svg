<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="apexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007A" />
      <stop offset="50%" stop-color="#E60023" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Squircle Backdrop -->
  <rect width="512" height="512" rx="140" fill="#0A0915" />
  <rect x="16" y="16" width="480" height="480" rx="124" stroke="url(#apexBg)" stroke-width="12" stroke-opacity="0.6" fill="none" filter="url(#neonGlow)" />

  <!-- Previous Authentic Apex 'A' Monogram Emblem (Reverted Back) -->
  <g filter="url(#neonGlow)">
    <path d="M256 60 L60 380 H160 L256 220 L352 380 H452 Z" fill="url(#apexBg)" />
  </g>
</svg>
